<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>短剧工作室 - Sedgo AI</title>
  <link rel="stylesheet" href="/static/css/profile.css">
  <style>
    :root {
      --drama-primary: #FF4757;
      --drama-secondary: #FF6B81;
      --drama-accent: #2ED573;
      --drama-dark: #1a1a2e;
      --drama-card: #16213e;
      --drama-glow: rgba(255,71,87,0.3);
    }

    /* ── Base Layout ── */
    .drama-body {
      background: var(--drama-dark);
      color: #fff;
      min-height: 100vh;
    }
    .drama-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    .drama-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 24px;
    }
    .drama-header h1 {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--drama-primary), var(--drama-accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .drama-back-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    .drama-back-btn:hover { background: rgba(255,255,255,0.2); }

    /* ── Project Cards ── */
    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .project-card {
      background: var(--drama-card);
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.3s;
      border: 1px solid rgba(255,255,255,0.05);
      position: relative;
      overflow: hidden;
    }
    .project-card:hover {
      transform: translateY(-4px);
      border-color: var(--drama-primary);
      box-shadow: 0 8px 24px var(--drama-glow);
    }
    .project-card .genre-tag {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 12px;
      background: var(--drama-primary);
      color: #fff;
      margin-bottom: 8px;
    }
    .project-card h3 {
      font-size: 16px;
      margin: 0 0 8px;
    }
    .project-card .meta {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
    }
    .project-card .status-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 8px;
      font-size: 11px;
      margin-top: 8px;
    }
    .status-draft { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.6); }
    .status-generating { background: rgba(46,213,115,0.2); color: var(--drama-accent); }
    .status-completed { background: rgba(255,71,87,0.2); color: var(--drama-primary); }

    /* ── Create Button ── */
    .create-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, var(--drama-primary), var(--drama-secondary));
      border: none;
      color: #fff;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .create-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 4px 16px var(--drama-glow);
    }

    /* ── Detail View ── */
    .detail-view { display: none; }
    .detail-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .detail-header h2 { margin: 0; font-size: 20px; }
    .episode-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .episode-card {
      background: var(--drama-card);
      border-radius: 10px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .episode-card:hover {
      border-color: var(--drama-secondary);
    }
    .episode-card .ep-num {
      font-size: 13px;
      color: var(--drama-primary);
      font-weight: 600;
    }
    .episode-card .ep-title {
      font-size: 15px;
      margin: 4px 0;
    }
    .episode-card .ep-hook {
      font-size: 13px;
      color: rgba(255,255,255,0.6);
      font-style: italic;
    }

    /* ── Scene Cards ── */
    .scene-list { margin-top: 16px; }
    .scene-card {
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
    }
    .scene-card .scene-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .scene-card .scene-prompt {
      font-size: 13px;
      color: rgba(255,255,255,0.7);
      word-break: break-all;
    }
    .scene-card .scene-video video {
      width: 100%;
      max-height: 200px;
      border-radius: 6px;
      margin-top: 8px;
    }

    /* ── Action Buttons ── */
    .action-bar {
      display: flex;
      gap: 10px;
      margin: 16px 0;
      flex-wrap: wrap;
    }
    .action-btn {
      padding: 8px 18px;
      border-radius: 8px;
      border: none;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--drama-primary); color: #fff; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; }
    .btn-secondary:hover { background: rgba(255,255,255,0.2); }
    .btn-success { background: var(--drama-accent); color: #fff; }
    .btn-success:hover { opacity: 0.9; }

    /* ── Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
      background: var(--drama-card);
      border-radius: 16px;
      padding: 24px;
      width: 90%;
      max-width: 480px;
    }
    .modal-content h3 { margin: 0 0 16px; }
    .modal-content input,
    .modal-content select,
    .modal-content textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: #fff;
      font-size: 14px;
      margin-bottom: 12px;
      box-sizing: border-box;
    }
    .modal-content textarea { min-height: 80px; resize: vertical; }
    .modal-content .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 12px;
    }

    /* ── Loading ── */
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: rgba(255,255,255,0.5);
    }
    .loading .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--drama-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Empty State ── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { color: rgba(255,255,255,0.5); }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .project-grid { grid-template-columns: 1fr; }
      .drama-container { padding: 12px; }
    }

    /* ── Scene Detail Panel ── */
    .scene-detail-panel {
      background: var(--drama-card);
      border-radius: 12px;
      padding: 20px;
      margin-top: 16px;
    }
    .scene-detail-panel .field {
      margin-bottom: 12px;
    }
    .scene-detail-panel .field-label {
      font-size: 12px;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .scene-detail-panel .field-value {
      font-size: 14px;
    }

    /* ── Progress Bar ── */
    .progress-bar {
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      overflow: hidden;
      margin: 8px 0;
    }
    .progress-bar .fill {
      height: 100%;
      background: linear-gradient(90deg, var(--drama-primary), var(--drama-accent));
      border-radius: 2px;
      transition: width 0.5s;
    }
  </style>
</head>
<body class="drama-body">
  <div class="drama-container">
    <!-- Header -->
    <div class="drama-header">
      <div>
        <h1>🎬 短剧工作室</h1>
        <p style="margin:4px 0 0; font-size:13px; color:rgba(255,255,255,0.5);">
          AI 赋能短剧创作 — 剧本策划 → 分镜导演 → 批量渲染 → 智能审片
        </p>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="drama-back-btn" onclick="window.location.href='/pages/profile.html'">← 返回</button>
      </div>
    </div>

    <!-- Project List View -->
    <div id="projectListView">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h2 style="margin:0; font-size:18px;">我的项目</h2>
        <button class="create-btn" onclick="showCreateModal()">+ 新项目</button>
      </div>
      <div id="projectGrid" class="project-grid"></div>
    </div>

    <!-- Project Detail View -->
    <div id="projectDetailView" class="detail-view">
      <div class="detail-header">
        <button class="drama-back-btn" onclick="showProjectList()">← 返回</button>
        <h2 id="detailTitle">项目详情</h2>
        <span id="detailStatus" class="status-badge"></span>
      </div>

      <!-- Action Bar -->
      <div class="action-bar" id="detailActions">
        <button class="action-btn btn-primary" onclick="generateScript()">📝 生成剧本</button>
        <button class="action-btn btn-secondary" onclick="generateBreakdown()">🎯 拆解分镜</button>
        <button class="action-btn btn-success" onclick="startRender()">🎬 批量渲染</button>
        <button class="action-btn btn-secondary" onclick="syncTasks()">🔄 同步状态</button>
      </div>

      <!-- Episode List -->
      <h3 style="margin:16px 0 8px; font-size:15px;">剧集列表</h3>
      <div id="episodeList" class="episode-list"></div>

      <!-- Scene Detail Panel -->
      <div id="scenePanel" class="scene-detail-panel" style="display:none;"></div>

      <!-- Export Manifest -->
      <div id="exportPanel" style="display:none; margin-top:16px;">
        <h3>📋 成片清单</h3>
        <div id="exportContent"></div>
      </div>
    </div>

    <!-- Create Modal -->
    <div id="createModal" class="modal-overlay">
      <div class="modal-content">
        <h3>创建新项目</h3>
        <input id="newTitle" placeholder="项目名称" />
        <select id="newGenre">
          <option value="逆袭">逆袭</option>
          <option value="重生">重生</option>
          <option value="霸总">霸总</option>
          <option value="甜宠">甜宠</option>
          <option value="穿越">穿越</option>
          <option value="古装">古装</option>
          <option value="悬疑">悬疑</option>
          <option value="都市">都市</option>
        </select>
        <textarea id="newLogline" placeholder="一句话梗概（可选）"></textarea>
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:12px;">
          <label style="font-size:14px;">集数：</label>
          <input id="newEpisodes" type="number" value="10" min="3" max="50" style="width:80px;" />
        </div>
        <div class="modal-actions">
          <button class="action-btn btn-secondary" onclick="closeModal('createModal')">取消</button>
          <button class="action-btn btn-primary" onclick="createProject()">创建</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/drama.js"></script>
</body>
</html>
